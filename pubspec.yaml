name: ypt_client
description: YPT(열품타) PC 클라이언트 — 비공식 데스크톱 클라 (본인 계정 interop)
publish_to: 'none'
version: 0.5.1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  # 시스템 트레이 상주. 0.6+ 은 nativeapi 기반으로 API 가 완전히 바뀌었으므로
  # 반드시 tray_manager.dart( 신규) 를 import 할 것. legacy.dart 는 구버전.
  tray_manager: ^0.7.0
  # 창 최소화/복원 제어. 트레이에서 창을 다시 띄울 때 필요.
  # 실제 확인된 최신 버전은 0.5.2 (0.6.0 은 존재하지 않음).
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ca/cacert.pem
    - assets/tray/tray_icon.png
