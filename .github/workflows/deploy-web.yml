name: Deploy Landing Page

# 只部署 landing/（Next.js 静态导出），不再构建 Flutter web demo。
#
# 原因：本项目是桌面客户端。lib/tray_service.dart 与 lib/app_log.dart
# 直接 import 'dart:io'，web 编译器不支持（tray_manager / 写 %LOCALAPPDATA%
# 文件在浏览器里都不存在）。lib/ca_setup.dart 做了条件导入隔离，
# 那两个文件没有，所以 `flutter build web` 必然失败。
# 桌面构建由 release.yml 负责，不受此影响。
on:
  push:
    branches:
      - main
    paths:
      - "landing/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Set static base path
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == *.github.io ]]; then
            base_path=""
          else
            base_path="/$repo_name"
          fi
          echo "NEXT_PUBLIC_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_REPOSITORY_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: landing
        run: npm ci

      - name: Build landing page
        working-directory: landing
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: landing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
